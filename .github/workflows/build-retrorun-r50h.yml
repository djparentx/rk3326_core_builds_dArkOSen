name: Build RetroRun (64 + 32) for R50H

on:
  workflow_dispatch:

jobs:
  build-retrorun-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build RetroRun in aarch64 Debian Trixie container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential g++-14 git cmake pkg-config \
                libsdl2-dev libpng-dev libdrm-dev libgbm-dev \
                libegl1-mesa-dev libgles2-mesa-dev libopenal-dev zlib1g-dev

              mkdir -p /usr/include/rga /usr/include/go2
              cp vendor/rga/include/*.h /usr/include/rga/
              cp vendor/rga/lib/librga.so* /usr/lib/aarch64-linux-gnu/
              cp vendor/go2/lib/libgo2.so /usr/lib/aarch64-linux-gnu/
              ldconfig

              ./builds.sh retrorun
            "

      - name: Debug - list build output
        run: find . -iname "retrorun*rk3326*"

      - name: Upload built RetroRun binary
        uses: actions/upload-artifact@v4
        with:
          name: retrorun-r50h-build
          path: |
            retrorun-64/retrorun-rk3326

  build-retrorun-armhf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build RetroRun in armhf Debian Trixie container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential g++-14 git cmake pkg-config \
                libsdl2-dev libpng-dev libdrm-dev libgbm-dev \
                libegl1-mesa-dev libgles2-mesa-dev libopenal-dev zlib1g-dev

              mkdir -p /usr/include/rga /usr/include/go2
              cp vendor/rga/include/*.h /usr/include/rga/
              cp vendor/rga/lib32/librga.so* /usr/lib/arm-linux-gnueabihf/
              cp vendor/go2/lib32/libgo2.so /usr/lib/arm-linux-gnueabihf/
              ldconfig

              ./builds.sh retrorun
            "

      - name: Debug - list build output
        run: find . -iname "retrorun*rk3326*"

      - name: Upload built RetroRun32 binary
        uses: actions/upload-artifact@v4
        with:
          name: retrorun32-r50h-build
          path: |
            retrorun-32/retrorun32-rk3326
