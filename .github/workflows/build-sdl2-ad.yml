name: Build SDL2 (advanced_drastic compatible)

on:
  workflow_dispatch:

jobs:
  build-sdl2-ad-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build SDL2 AD in aarch64 Debian Trixie container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential git cmake pkg-config \
                libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
                libasound2-dev libpulse-dev libsamplerate0-dev \
                libudev-dev libevdev-dev zlib1g-dev
              mkdir -p /usr/include/rga
              cp vendor/rga/include/*.h /usr/include/rga/
              cp vendor/rga/lib/librga.so* /usr/lib/aarch64-linux-gnu/
              ldconfig
              ./builds.sh sdl2-ad
            "

      - name: Upload built SDL2 AD binary
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-ad-build
          path: |
            sdl2-ad-64/libSDL2-2.0.so.0.3000.10
