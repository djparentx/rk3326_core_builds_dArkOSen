name: Build Flycast Standalone v2.7 (test)

on:
  workflow_dispatch:

jobs:
  build-flycastsa-v27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: flycastsa27-ccache-${{ hashFiles('patches/flycastsa-patch*', 'scripts/flycastsa27.sh') }}
          restore-keys: |
            flycastsa27-ccache-

      - name: Build Flycast v2.7 in aarch64 Debian Trixie container
        run: |
          mkdir -p ${{ github.workspace }}/.ccache
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            debian:trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential git cmake pkg-config ccache libomp-dev \
                libsdl2-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
                libevdev-dev libcurl4-openssl-dev zlib1g-dev libpng-dev \
                libzip-dev liblzma-dev
              mkdir -p /usr/local/lib/aarch64-linux-gnu
              ccache --max-size=2G
              ./builds.sh flycastsa27
              ccache --show-stats
            "

      - name: Upload built Flycast binary
        uses: actions/upload-artifact@v4
        with:
          name: flycastsa-v2.7
          if-no-files-found: error
          path: flycastsa-64/flycast-v2.7