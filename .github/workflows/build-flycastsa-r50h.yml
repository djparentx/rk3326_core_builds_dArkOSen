name: Build Flycast Standalone (aarch64)

on:
  workflow_dispatch:

jobs:
  build-flycastsa-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Flycast standalone in aarch64 Debian Trixie container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential git cmake pkg-config \
                libsdl2-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
                libevdev-dev libcurl4-openssl-dev zlib1g-dev libpng-dev \
                libzip-dev liblzma-dev
              ./builds.sh flycastsa
            "

      - name: Debug - list build output
        run: find . -iname "flycast-rk3326*"

      - name: Upload built Flycast binaries
        uses: actions/upload-artifact@v4
        with:
          name: flycastsa-r50h-build
          path: |
            flycastsa-64/flycast-rk3326.rot
            flycastsa-64/flycast-rk3326.unrot
