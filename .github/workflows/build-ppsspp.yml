name: Build PPSSPP Standalone

on:
  workflow_dispatch:

jobs:
  build-ppsspp-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build PPSSPP in aarch64 Debian Trixie container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential git cmake pkg-config clang \
                libsdl2-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
                libx11-dev libsm-dev libxext-dev libudev-dev libasound2-dev \
                libfreetype6-dev mercurial zlib1g-dev
              sed -i 's|/usr/lib/aarch64-linux-gnu/include/SDL2|/usr/include/SDL2|' scripts/ppsspp.sh
              ./builds.sh ppsspp
            "

      - name: Upload PPSSPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-standalone
          if-no-files-found: error
          path: |
            ppsspp64/PPSSPPSDL
            ppsspp64/ppssppsdl_pkg_*.tar.gz
