name: Build DuckStation Mini (cross-compiled arm64)

on:
  workflow_dispatch:

jobs:
  build-duckstationmini-arm64:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/duckstation/cross-build-arm64:latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set safe directory
        shell: bash
        run: git config --global --add safe.directory "*"

      - name: Build DuckStation Mini
        shell: bash
        run: |
          chmod +x scripts/duckstationmini.sh
          ./scripts/duckstationmini.sh

      - name: Upload DuckStation Mini
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckstationmini-arm64
          if-no-files-found: error
          path: |
            duckstationmini-64/duckstationmini_pkg.tar.gz
            duckstationmini-64/build-info.txt
