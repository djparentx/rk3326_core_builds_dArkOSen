name: Build PPSSPP 2021 Standalone

on:
  workflow_dispatch:

jobs:
  build-ppsspp-2021-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build PPSSPP 2021 in aarch64 Debian Trixie container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential git cmake pkg-config clang \
                libsdl2-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
                libx11-dev libsm-dev libxext-dev libudev-dev libasound2-dev \
                libfreetype6-dev mercurial zlib1g-dev
              ./builds.sh ppsspp-2021
            "

      - name: Upload PPSSPP 2021 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-2021-standalone
          if-no-files-found: error
          path: |
            ppsspp-2021_64/PPSSPPSDL.rk3326
            ppsspp-2021_64/ppssppsdl_2021_pkg_*.tar.gz
